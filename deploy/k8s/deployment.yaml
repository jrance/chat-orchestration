apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeless-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeless-orchestrator
  template:
    metadata:
      labels:
        app: codeless-orchestrator
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: app
          image: your-repo/codeless-orchestrator:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: WORKER_TIMEOUT
              value: "0"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

