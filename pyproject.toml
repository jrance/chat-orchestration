[build-system]
requires = ["hatchling>=1.25.0,<2"]
build-backend = "hatchling.build"

[project]
name = "codeless-orchestrator"
version = "0.0.1"
description = "Codeless agent orchestration engine using LangGraph and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Codeless Orchestrator Maintainers" }]
keywords = ["agents", "langgraph", "fastapi", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "langgraph>=0.6.10,<0.7",
  "langchain-core>=0.3.79,<0.4",
  "fastapi>=0.119.0,<0.120",
  "starlette>=0.48.0,<0.49",
  "uvicorn>=0.37.0,<0.38",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.12.0,<3",
  "openai>=2.3.0,<3",
  "google-generativeai>=0.8.5,<0.9",
  "duckduckgo-search>=8.1.1,<9",
  "jsonschema>=4.23.0,<5",
]

[project.optional-dependencies]
json = ["orjson>=3.10.7,<4"]
sse = ["sse-starlette>=3.0.2,<4"]
otel = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp>=1.27,<2",
]
dev = [
  "pytest>=8.4.2,<9",
  "pytest-cov>=4.1.0,<5",
  "pytest-asyncio>=1.2.0,<2",
  "coverage>=7.10.7,<8",
  "ruff>=0.14.0,<0.15",
  "mypy>=1.18.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeless_orchestrator"]

[tool.hatch.build.targets.sdist]
include = [
  "src/codeless_orchestrator",
  "README.md",
  "LICENSE*",
  "pyproject.toml",
  "tests",
  "docs",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
pretty = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
